services:
  - type: web
    name: citas-simtec
    env: python
    region: oregon
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "flask --app wsgi run --host=0.0.0.0 --port=$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: AGENTE_API_KEY
        sync: false
      - key: FLASK_ENV
        value: production
